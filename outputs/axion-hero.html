  <style>
    :root { --acid: #00ff9d; --emerald: #10b981; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #000; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { overflow: hidden; }
    .hero { position: relative; height: 100svh; min-height: 620px; overflow: hidden; isolation: isolate; background: #000; }
    .hero:before { content: ''; position: absolute; inset: 0; z-index: 3; opacity: .58; pointer-events:none; background-image: linear-gradient(rgba(16,185,129,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(16,185,129,.035) 1px, transparent 1px); background-size: 60px 60px; mask-image: linear-gradient(90deg, rgba(0,0,0,.9), transparent 88%); }
    .vignette { position:absolute; inset:0; z-index:4; pointer-events:none; background: radial-gradient(circle at 70% 45%, transparent 10%, rgba(0,0,0,.18) 55%, rgba(0,0,0,.86) 100%), linear-gradient(90deg, rgba(0,0,0,.98) 0%, rgba(0,0,0,.58) 35%, transparent 74%); }
    .stage { position:absolute; inset:0; z-index:1; background:#000; }
    .stage img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position: right center; user-select:none; pointer-events:none; }
    .base-statue { opacity:.94; }
    .mask-statue { z-index:2; mask-repeat:no-repeat; -webkit-mask-repeat:no-repeat; mask-size:100% 100%; -webkit-mask-size:100% 100%; }
    #particles { position:absolute; inset:0; z-index:5; width:100%; height:100%; pointer-events:none; }
    .spotlight { position:absolute; z-index:6; border:1px solid rgba(0,255,157,.6); border-radius:50%; pointer-events:none; transform:translate(-50%,-50%); box-shadow: 0 0 26px rgba(0,255,157,.16), inset 0 0 25px rgba(0,255,157,.07); opacity:.78; }
    .spotlight:after { content:''; position:absolute; inset:13%; border:1px solid rgba(0,255,157,.24); border-radius:50%; }
    .shell { position:relative; z-index:20; height:100%; max-width:1440px; margin:auto; padding:28px clamp(20px,5vw,72px) 24px; display:flex; flex-direction:column; }
    .nav-capsule, .glass-btn { background:rgba(8,16,12,.78); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid rgba(0,255,157,.22); }
    .nav-capsule { border-radius:999px; }
    .logo-mark { width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:rgba(0,0,0,.76); border:1px solid rgba(16,185,129,.45); box-shadow:0 0 18px rgba(0,255,157,.2); }
    .brand { font-family:'Syne',sans-serif; font-weight:800; letter-spacing:.12em; }
    .nav-link { position:relative; color:rgba(226,232,240,.68); transition:color .2s ease; }
    .nav-link:hover, .nav-link.active { color:#fff; }
    .nav-link.active:after { content:''; position:absolute; height:2px; left:50%; right:50%; bottom:-9px; background:var(--acid); box-shadow:0 0 8px var(--acid); transition:.2s; }
    .nav-link.active:after { left:25%; right:25%; }
    .content { margin-top:auto; margin-bottom:auto; max-width:680px; padding-top:5vh; }
    .eyebrow { display:inline-flex; align-items:center; gap:9px; padding:8px 14px; border:1px solid rgba(16,185,129,.42); border-radius:999px; background:rgba(0,0,0,.76); color:var(--acid); font-size:10px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; }
    .pulse { width:7px; height:7px; border-radius:50%; background:var(--acid); box-shadow:0 0 0 0 rgba(0,255,157,.7); animation:pulse 1.8s infinite; }
    @keyframes pulse { 70% { box-shadow:0 0 0 8px rgba(0,255,157,0); } 100% { box-shadow:0 0 0 0 rgba(0,255,157,0); } }
    h1 { margin:22px 0 12px; font-family:'Syne',sans-serif; font-size:clamp(4rem,10vw,8.5rem); line-height:.84; letter-spacing:-.045em; }
    .subhead { max-width:540px; color:#d7e2dd; font-weight:300; letter-spacing:.035em; font-size:clamp(1.08rem,2.2vw,1.48rem); }
    .actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:32px; }
    .action { display:inline-flex; align-items:center; gap:13px; min-height:52px; padding:8px 18px 8px 20px; border-radius:999px; color:#f8fafc; font-weight:700; font-size:13px; letter-spacing:.01em; background:rgba(0,0,0,.6); border:1px solid rgba(255,255,255,.18); backdrop-filter:blur(12px); transition:transform .2s, border-color .2s, background .2s; }
    .action:hover { transform:translateY(-2px); border-color:rgba(0,255,157,.7); }
    .action.primary { background:rgba(2,44,34,.78); border-color:rgba(16,185,129,.6); color:var(--acid); }
    .round-icon { width:34px; height:34px; display:grid; place-items:center; border-radius:50%; background:#fff; color:#000; transition:transform .2s, background .2s; }
    .action:hover .round-icon { transform:translateX(3px); background:var(--acid); }
    .footer { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; color:rgba(226,232,240,.55); font-size:10px; letter-spacing:.16em; text-transform:uppercase; }
    .socials { display:flex; gap:10px; }
    .social { width:34px; height:34px; display:grid; place-items:center; border:1px solid rgba(255,255,255,.16); border-radius:50%; color:#cbd5d1; transition:.2s; }
    .social:hover { color:var(--acid); border-color:var(--acid); }
    .scroll-indicator { display:flex; flex-direction:column; align-items:center; gap:8px; }
    .mouse { width:22px; height:34px; border:1px solid rgba(255,255,255,.55); border-radius:999px; padding-top:6px; display:flex; justify-content:center; }
    .wheel { width:3px; height:7px; background:var(--acid); border-radius:4px; animation:wheel 2s infinite; }
    @keyframes wheel { 0%,100% { transform:translateY(0); opacity:.35; } 45% { transform:translateY(9px); opacity:1; } }
    .status { display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px; background:rgba(0,0,0,.64); border:1px solid rgba(16,185,129,.28); color:rgba(167,243,208,.86); }
    .status i { width:6px; height:6px; background:var(--acid); border-radius:50%; box-shadow:0 0 9px var(--acid); }
    .drawer { position:absolute; z-index:40; top:82px; right:20px; width:min(330px,calc(100% - 40px)); padding:20px; border-radius:20px; background:rgba(8,16,12,.94); border:1px solid rgba(0,255,157,.3); box-shadow:0 18px 80px rgba(0,0,0,.6); transform:translateY(-12px); opacity:0; pointer-events:none; transition:.25s ease; }
    .drawer.open { transform:translateY(0); opacity:1; pointer-events:auto; }
    .drawer a { display:flex; justify-content:space-between; padding:14px 4px; border-bottom:1px solid rgba(255,255,255,.08); color:#e2e8f0; }
    @media (max-width:767px) { body{overflow:hidden} .hero{min-height:560px} .stage img{object-position:75% center; opacity:.85} .vignette{background:radial-gradient(circle at 75% 45%, transparent 6%, rgba(0,0,0,.3) 50%, rgba(0,0,0,.94) 100%), linear-gradient(90deg,rgba(0,0,0,.87),transparent 100%)} .shell{padding:20px 20px 18px} .content{padding-top:3vh; margin-bottom:12vh} h1{font-size:clamp(4rem,19vw,6rem); margin-top:18px} .subhead{font-size:1.02rem; line-height:1.5} .footer{font-size:9px} .scroll-indicator{display:none} .spotlight{opacity:.58} }
    @media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<body>
  <main class="hero" id="hero">
    <div class="stage" aria-hidden="true">
      <img class="base-statue" src="https://strvid.nyc3.cdn.digitaloceanspaces.com/motionsite/statu-image.png" alt="">
      <img class="mask-statue" id="maskLayer" src="https://strvid.nyc3.cdn.digitaloceanspaces.com/motionsite/statu-image-hover.png" alt="">
    </div>
    <canvas id="particles" aria-hidden="true"></canvas>
    <div class="spotlight" id="spotlight" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="shell">
      <header class="flex items-center justify-between gap-5">
        <a class="flex items-center gap-3" href="#top" aria-label="AXION home"><span class="logo-mark"><i data-lucide="triangle" width="20" height="20" stroke-width="1.4" color="#00ff9d"></i></span><span class="brand text-xl sm:text-2xl">AXION</span></a>
        <nav class="nav-capsule hidden md:flex items-center gap-7 px-6 py-3 text-sm" aria-label="Primary"><a class="nav-link active" href="#top">Home</a><a class="nav-link" href="#about">About</a><a class="nav-link" href="#services">Services</a><a class="nav-link" href="#contact">Contact</a></nav>
        <div class="flex items-center gap-2"><button class="glass-btn grid h-10 w-10 place-items-center rounded-full text-slate-200 hover:text-white" id="soundToggle" aria-label="Toggle sound"><i data-lucide="volume-2" width="17"></i></button><a class="hidden md:inline-flex items-center gap-2 rounded-full bg-emerald-500 px-5 py-2.5 text-sm font-extrabold text-black shadow-[0_0_20px_rgba(16,185,129,.35)] transition hover:bg-emerald-400" href="#portal">Explore portal <i data-lucide="arrow-up-right" width="16"></i></a><button class="glass-btn grid h-10 w-10 place-items-center rounded-full md:hidden" id="menuToggle" aria-label="Open menu" aria-expanded="false"><i data-lucide="menu" width="18"></i></button></div>
      </header>
      <section class="content" id="top"><div class="eyebrow"><span class="pulse"></span>Cyber-AXION intelligence</div><h1>AXION</h1><p class="subhead">Empowering innovation with power &amp; wisdom.</p><div class="actions"><a class="action" href="#discover">Discover the signal <span class="round-icon"><i data-lucide="arrow-right" width="17"></i></span></a><a class="action primary" href="#connect"><span class="grid h-8 w-8 place-items-center rounded-full bg-emerald-950 text-[var(--acid)]"><i data-lucide="triangle" width="15"></i></span>Connect to AXION</a></div></section>
      <footer class="footer"><div class="socials"><a class="social" href="#facebook" aria-label="Facebook"><i data-lucide="facebook" width="15"></i></a><a class="social" href="#instagram" aria-label="Instagram"><i data-lucide="instagram" width="15"></i></a><a class="social" href="#twitter" aria-label="X"><i data-lucide="twitter" width="15"></i></a></div><div class="scroll-indicator"><span>Scroll to explore</span><span class="mouse"><span class="wheel"></span></span></div><div class="status"><i></i>Mask active</div></footer>
    </div>
    <aside class="drawer" id="drawer"><div class="mb-2 flex items-center justify-between text-[10px] uppercase tracking-[.2em] text-emerald-300">Navigate <button id="drawerClose" aria-label="Close menu"><i data-lucide="x" width="18"></i></button></div><a href="#top">Home <i data-lucide="arrow-up-right" width="15"></i></a><a href="#about">About <i data-lucide="arrow-up-right" width="15"></i></a><a href="#services">Services <i data-lucide="arrow-up-right" width="15"></i></a><a href="#contact">Contact <i data-lucide="arrow-up-right" width="15"></i></a></aside>
  </main>
  <script>
    lucide.createIcons();
    const hero=document.getElementById('hero'), mask=document.getElementById('maskLayer'), halo=document.getElementById('spotlight');
    let targetX=innerWidth*.68,targetY=innerHeight*.5,currentX=targetX,currentY=targetY,isHovered=false,radius=150;
    function move(x,y){ targetX=x; targetY=y; isHovered=true; }
    hero.addEventListener('mousemove',e=>move(e.clientX,e.clientY));
    hero.addEventListener('mouseleave',()=>isHovered=false);
    hero.addEventListener('touchmove',e=>{const t=e.touches[0]; if(t) move(t.clientX,t.clientY)},{passive:true});
    hero.addEventListener('touchend',()=>isHovered=false,{passive:true});
    function animate(){ const ease=isHovered?.16:.045; if(!isHovered){const t=performance.now()*.0012; targetX=innerWidth*.68+Math.cos(t)*46; targetY=innerHeight*.5+Math.sin(t*1.3)*32;} currentX+=(targetX-currentX)*ease; currentY+=(targetY-currentY)*ease; const css=`radial-gradient(circle ${radius}px at ${currentX}px ${currentY}px, #000 0%, rgba(0,0,0,.86) 45%, rgba(0,0,0,.35) 70%, transparent 100%)`; mask.style.maskImage=css; mask.style.webkitMaskImage=css; halo.style.left=currentX+'px'; halo.style.top=currentY+'px'; halo.style.width=radius*2+'px'; halo.style.height=radius*2+'px'; requestAnimationFrame(animate); } animate();
    const canvas=document.getElementById('particles'),ctx=canvas.getContext('2d'); let dots=[];
    function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); dots=Array.from({length:52},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.6+.35,v:(Math.random()-.5)*.16,a:Math.random()*.5+.18}));} resize(); addEventListener('resize',resize);
    function particles(){ctx.clearRect(0,0,innerWidth,innerHeight); for(const p of dots){p.y-=p.v; if(p.y<-4)p.y=innerHeight+4; ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(0,255,157,${p.a})`;ctx.shadowBlur=10;ctx.shadowColor='#00ff9d';ctx.fill();} requestAnimationFrame(particles);} particles();
    const drawer=document.getElementById('drawer'),toggle=document.getElementById('menuToggle'); function setDrawer(open){drawer.classList.toggle('open',open);toggle?.setAttribute('aria-expanded',open);}
    toggle?.addEventListener('click',()=>setDrawer(!drawer.classList.contains('open'))); document.getElementById('drawerClose').addEventListener('click',()=>setDrawer(false)); drawer.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>setDrawer(false)));
    let audioCtx; document.getElementById('soundToggle').addEventListener('click',()=>{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.frequency.value=520; o.type='sine'; g.gain.setValueAtTime(.0001,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(.045,audioCtx.currentTime+.01); g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.12); o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+.13); });
  </script>
